# Only the settings Taper deliberately chooses. `supabase init` generates 400
# lines of commented defaults; carrying them makes the handful of real decisions
# invisible, so they are omitted and the CLI defaults apply.
#
# Caveat that matters: `supabase config push` is authoritative. A setting that is
# absent here is pushed as its *default*, not left alone — so changing something
# in the dashboard without adding it to this file means the next push silently
# reverts it. Add the key here first.

project_id = "taper-mobile"

# Local ports, moved off the CLI defaults (54321–54327).
#
# Those defaults are per-machine, not per-project, so any second local Supabase
# stack collides with the first — `supabase start` fails on "port is already
# allocated" and, worse, whichever project is already running looks like the
# culprit. Another project on this machine holds the default range, so this one
# is explicit. Nothing here affects the hosted project; these ports exist only
# while `supabase start` is running.

[api]
port = 55321

[db]
port = 55322

[studio]
port = 55323

[local_smtp]
port = 55324

[analytics]
port = 55327

[auth]
# Anonymous sign-in gives every user a real JWT — and therefore a real `sub` to
# hang a journal off later — without a login screen in front of a food lookup.
# The user can link an email or OAuth identity to the same account afterwards.
#
# Anonymous users take the `authenticated` Postgres role, same as permanent
# users, and carry an `is_anonymous` claim. Any future RLS policy must check
# that claim rather than `auth.role()`, which cannot tell the two apart.
enable_anonymous_sign_ins = true

# The three blocks below are not choices Taper is making — they restate the
# platform defaults so that pushing this file cannot silently lower them.
#
# This is the caveat at the top of the file, learned the hard way: `config push`
# applied every default for every key this file omitted, which turned email
# confirmations off, dropped the resend interval from a minute to a second, cut
# OTP length from 8 to 6, and disabled TOTP enrolment. None of that was
# intended; all of it followed from the keys being absent. Pin them.
site_url = "http://localhost:3000"
additional_redirect_urls = []

[auth.email]
# Off means anyone can register an address they do not control.
enable_confirmations = true
# The only rate limit on confirmation mail. At 1s the endpoint is an email
# cannon pointed at whatever address the caller names.
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
# Per IP, per hour. Each anonymous sign-in writes a row to `auth.users`, and the
# endpoint is unauthenticated by definition, so this is the only thing standing
# between the project and someone inflating the user table. Supabase's default;
# stated explicitly because it is a security control, not an incidental knob.
anonymous_users = 30

[functions.food-search]
# The platform verifies the JWT's signature before the function runs. That alone
# does not mean "a signed-in user" — with legacy keys the anon key is itself a
# valid JWT and it ships inside the app bundle. The function re-checks the
# claims; see the comment in its handler.
verify_jwt = true

[functions.nrt-search]
# Same reasoning as above: platform verification proves the signature, and the
# function re-checks the claims because the anon key is itself a valid JWT that
# ships in the bundle. Stated explicitly rather than left to the default,
# because an unauthenticated product lookup would let anyone spend the openFDA
# daily quota this project shares.
verify_jwt = true
