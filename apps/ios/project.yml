name: Taper
options:
  bundleIdPrefix: com.graemkrietzman
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.1
targets:
  Taper:
    type: application
    platform: iOS
    sources: [Taper]
    dependencies:
      - package: Supabase
    # Written from the repository .env by Scripts/write-config.sh, which must be
    # run before `xcodegen generate`. Gitignored, like the .env it comes from.
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    info:
      path: Taper/Resources/Info.plist
      properties:
        # The backend the app talks to. Expo inlined EXPO_PUBLIC_* into the JS
        # bundle at build time; this is the same idea for a native build, and
        # without it the app has a backend only while a test is driving it.
        # Scheme and host arrive separately because an xcconfig reads `//` as a
        # comment — see Scripts/write-config.sh.
        EXPO_PUBLIC_SUPABASE_URL: "$(SUPABASE_URL_SCHEME)://$(SUPABASE_URL_HOST)"
        EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "$(SUPABASE_PUBLISHABLE_KEY)"
        CFBundleDisplayName: Taper
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts:
          - Ginger.otf
          - LinearGrotesk-Regular.otf
          - LinearGrotesk-Medium.otf
          - LinearGrotesk-SemiBold.otf
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.graemkrietzman.taper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  TaperTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TaperTests]
    dependencies:
      - target: Taper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  # Drives the shipped binary. The unit suite reaches every model in the app and
  # no view in it, so twelve built screens have only ever been checked by
  # someone looking at them once — and a screenshot taken from a throwaway
  # harness is not a check anything can re-run.
  TaperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TaperUITests]
    dependencies:
      - target: Taper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Taper:
    build:
      targets:
        Taper: all
        TaperTests: [test]
        TaperUITests: [test]
    test:
      targets: [TaperTests, TaperUITests]
      # Passed through from the xcodebuild command line, because a unit bundle
      # hosted in the app does not inherit the shell's environment and
      # TEST_RUNNER_* only reaches an XCUITest runner. Empty unless supplied,
      # which is what makes the live store tests skip rather than fail on a
      # machine with no local stack.
      environmentVariables:
        TAPER_TEST_SUPABASE_URL: $(TAPER_TEST_SUPABASE_URL)
        TAPER_TEST_SUPABASE_KEY: $(TAPER_TEST_SUPABASE_KEY)
