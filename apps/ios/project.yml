name: FoodPad
options:
  bundleIdPrefix: com.graemkrietzman
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.1
targets:
  FoodPad:
    type: application
    platform: iOS
    sources: [FoodPad]
    dependencies:
      - package: Supabase
    info:
      path: FoodPad/Resources/Info.plist
      properties:
        CFBundleDisplayName: Food Pad
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts:
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.graemkrietzman.foodpad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  FoodPadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FoodPadUITests]
    dependencies:
      - target: FoodPad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  FoodPadTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FoodPadTests]
    dependencies:
      - target: FoodPad
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FoodPad:
    build:
      targets:
        FoodPad: all
        FoodPadTests: [test]
        FoodPadUITests: [test]
    test:
      targets: [FoodPadTests, FoodPadUITests]
